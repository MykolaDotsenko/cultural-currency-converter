<figure class="qa-media" data-media-kind="{{ image.kind }}">
  <div class="qa-media__frame"
       style="aspect-ratio: {{ display_ratio|default:image.ratio }}">
    <img class="qa-media__image"
         src="{{ image.src }}"
         {% if image.srcset %}srcset="{{ image.srcset }}" sizes="{{ sizes|default:image.sizes|default:'100vw' }}"{% endif %}
         alt="{{ image.alt }}"
         width="{{ image.width }}"
         height="{{ image.height }}"
         loading="{{ loading|default:'lazy' }}"
         decoding="async"
         {% if image.focal_position %}style="object-position: {{ image.focal_position }}"{% endif %}
         {% if fetchpriority %}fetchpriority="{{ fetchpriority }}"{% endif %}
         {% if image.decorative %}aria-hidden="true"{% endif %}>
  </div>
  {% if caption or image.caption or image.authenticity_label or image.attribution_text or image.licence_id or image.change_note %}
    <figcaption class="qa-media__caption">
      {% if caption %}
        <span>{{ caption }}</span>
      {% elif image.caption %}
        <span>{{ image.caption }}</span>
      {% endif %}
      {% if image.authenticity_label %}
        <span class="qa-media__authenticity">{{ image.authenticity_label }}</span>
      {% endif %}
      {% if image.attribution_text %}
        {% if image.source_url %}
          <a class="qa-media__attribution"
             href="{{ image.source_url }}"
             rel="noopener noreferrer">{{ image.attribution_text }}</a>
        {% else %}
          <span class="qa-media__attribution">{{ image.attribution_text }}</span>
        {% endif %}
      {% endif %}
      {% if image.licence_id and image.licence_url %}
        <a class="qa-media__licence"
           href="{{ image.licence_url }}"
           rel="noopener noreferrer">{{ image.licence_id }}</a>
      {% endif %}
      {% if image.change_note %}
        <span class="qa-media__change-note">{{ image.change_note }}</span>
      {% endif %}
    </figcaption>
  {% endif %}
</figure>
