<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="630"
     viewBox="0 0 1200 630"
     role="img"
     aria-labelledby="title desc">
  <title id="title">{{ share_card.title }}</title>
  <desc id="desc">{{ share_card.description }} {{ share_card.trust_note }}</desc>
  <rect width="1200" height="630" fill="#f5f2eb"/>
  <rect x="60"
        y="60"
        width="1080"
        height="510"
        rx="34"
        fill="#fffdf9"
        stroke="#dcd6cb"
        stroke-width="2"/>
  <text x="110"
        y="130"
        font-family="system-ui, sans-serif"
        font-size="26"
        font-weight="700"
        fill="#675f53">{{ share_card.kind_label }}</text>
  <text x="110"
        y="185"
        font-family="system-ui, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#25221f">{{ share_card.scope_label }}</text>
  <text x="110"
        y="270"
        font-family="system-ui, sans-serif"
        font-size="34"
        fill="#5e574e">{{ share_card.input_text }} {{ share_card.relation_symbol }}</text>
  <text x="110"
        y="365"
        font-family="system-ui, sans-serif"
        font-size="{{ share_card.output_font_size }}"
        font-weight="750"
        fill="#171513">{{ share_card.output_text }}</text>
  <text x="110"
        y="430"
        font-family="system-ui, sans-serif"
        font-size="24"
        fill="#5e574e">{{ share_card.rate_line }}</text>
  <text x="110"
        y="485"
        font-family="system-ui, sans-serif"
        font-size="22"
        fill="#675f53">{{ share_card.status_label }} · effective {{ share_card.effective_date_label }} · {{ share_card.provider_label }}</text>
  <text x="110"
        y="535"
        font-family="system-ui, sans-serif"
        font-size="20"
        fill="#7b7368">Stored snapshot · not a live quote · Cultural Currency</text>
</svg>
