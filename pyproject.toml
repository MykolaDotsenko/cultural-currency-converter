[project]
name = "cultural-currency-converter"
version = "0.1.0"
description = "Django-first travel-money intelligence application."
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [
    { name = "Mykola Dotsenko" },
]
dependencies = [
    "Django==5.2.17",
    "django-storages-s3==0.1.4",
    "django-template-partials==25.3",
    "django-htmx==1.29.0",
    "psycopg[binary]==3.3.6",
    "Pillow==12.3.0",
    "google-genai==2.24.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "gunicorn==23.0.0",
    "whitenoise==6.11.0",
]

[project.optional-dependencies]
dev = [
    "coverage==7.16.1",
    "djlint==1.46.1",
    "pip-audit==2.10.1",
    "playwright==1.63.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "mypy==2.3.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*", "integrations*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["apps", "config", "integrations"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["–", "Ε"]

[tool.ruff.lint.per-file-ignores]
"apps/*/migrations/*.py" = ["RUF012"]
"apps/*/models.py" = ["RUF012"]
"apps/*/tests/*.py" = ["SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["apps", "config", "integrations"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100

# The media component intentionally uses a trusted dynamic aspect-ratio style; see docs/INTEGRATIONS_AI_MEDIA.md.
[tool.djlint.per-file-ignores]
"templates/components/media/image_frame.html" = "H021"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
