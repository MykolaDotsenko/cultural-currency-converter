name: Browser quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "templates/**"
      - "apps/accounts/**"
      - "apps/common/**"
      - "apps/countries/**"
      - "apps/culture/**"
      - "apps/exchange/**"
      - "apps/travel/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/browser-quality.yml"
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "templates/**"
      - "apps/accounts/**"
      - "apps/common/**"
      - "apps/countries/**"
      - "apps/culture/**"
      - "apps/exchange/**"
      - "apps/travel/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/browser-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: ${{ matrix.browser }} / ${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            scope: full
          - browser: firefox
            scope: smoke
          - browser: webkit
            scope: smoke
    timeout-minutes: 20
    env:
      APP_ENV: test
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      FX_TEST_FIXTURE_ENABLED: "true"
      AI_RUNTIME_EXPLANATION_ENABLED: "true"
      AI_RUNTIME_TEST_FIXTURE_ENABLED: "true"
      BROWSER_QUALITY_ENGINE: ${{ matrix.browser }}
      BROWSER_QUALITY_SCOPE: ${{ matrix.scope }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Template format
        run: |
          djlint templates/pages/explore.html --reformat --no-github-output
          git diff -- templates/pages/explore.html
          exit 1

      - name: Template lint
        run: djlint templates --lint --no-github-output

      - name: Frontend quality and production build
        working-directory: frontend
        run: npm run quality

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Django system check
        run: python manage.py check

      - name: Prepare product reference data
        run: |
          python manage.py migrate --noinput
          python manage.py seed_reference_data
          python manage.py seed_story_data
          python manage.py seed_destination_context

      - name: Start design QA server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/browser-quality-server.log 2>&1 &
          echo $! > /tmp/browser-quality-server.pid

          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          urls = (
              "http://127.0.0.1:8000/",
              "http://127.0.0.1:8000/_design/shell/",
              "http://127.0.0.1:8000/_design/converter/",
          )
          deadline = time.time() + 20

          while time.time() < deadline:
              try:
                  if all(
                      urllib.request.urlopen(url, timeout=2).status == 200
                      for url in urls
                  ):
                      break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.5)
          else:
              raise SystemExit("Browser quality server did not become ready")
          PY

      - name: Axe, reflow, reduced-motion and forced-colors QA
        working-directory: frontend
        run: npm run browser:quality

      - name: Upload browser quality evidence
        uses: actions/upload-artifact@v7
        with:
          name: quiet-atlas-browser-quality-${{ matrix.browser }}
          path: artifacts/browser-quality/
          if-no-files-found: error
          retention-days: 14

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/browser-quality-server.log || true

      - name: Stop design QA server
        if: always()
        run: |
          if [ -f /tmp/browser-quality-server.pid ]; then
            kill "$(cat /tmp/browser-quality-server.pid)" || true
          fi
