name: Required merge quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: required-merge-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      frontend: ${{ steps.changes.outputs.frontend }}
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python=false
          frontend=false
          browser=false

          while IFS= read -r file; do
            case "$file" in
              apps/*|config/*|scripts/*|manage.py|pyproject.toml|.pre-commit-config.yaml)
                python=true
                ;;
            esac

            case "$file" in
              frontend/*|apps/common/templatetags/vite.py|config/settings.py|.nvmrc)
                frontend=true
                ;;
            esac

            case "$file" in
              frontend/*|templates/*|apps/*|config/*|scripts/*|manage.py|pyproject.toml|.nvmrc)
                browser=true
                ;;
            esac

            case "$file" in
              .github/workflows/*)
                python=true
                frontend=true
                browser=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          {
            echo "python=$python"
            echo "frontend=$frontend"
            echo "browser=$browser"
          } >> "$GITHUB_OUTPUT"

  python:
    name: Python 3.13 required
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Python and Django quality
        run: |
          pre-commit validate-config
          ruff format --check apps config scripts manage.py
          ruff check apps config scripts manage.py
          mypy \
            apps/exchange/domain.py \
            apps/exchange/budget.py \
            apps/exchange/comparison.py \
            apps/exchange/money_context.py \
            apps/exchange/payment_estimate.py \
            apps/exchange/providers/base.py \
            apps/exchange/providers/frankfurter.py \
            apps/travel/scenarios.py \
            config/environment.py \
            config/database.py \
            config/cache.py \
            config/csp.py \
            config/ai.py \
            integrations/gemini/client.py
          djlint templates --check
          python manage.py check
          python manage.py makemigrations --check --dry-run
          coverage erase
          coverage run -m pytest -q
          coverage report
          python -m pip_audit --skip-editable

  postgres:
    name: PostgreSQL 18.6 required
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cultural_currency_test
      CACHE_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: cultural_currency_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cultural_currency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify shared Redis cache
        run: |
          python manage.py shell -c "from django.conf import settings; from django.core.cache import cache; assert settings.CACHES['default']['BACKEND'] == 'django.core.cache.backends.redis.RedisCache'; cache.set('ci:shared-cache', 'ok', 30); assert cache.get('ci:shared-cache') == 'ok'; cache.delete('ci:shared-lock'); assert cache.add('ci:shared-lock', 'owner-a', 30) is True; assert cache.add('ci:shared-lock', 'owner-b', 30) is False"

      - name: Verify readiness against PostgreSQL and Redis
        run: |
          python manage.py shell -c "from django.test import Client; response = Client().get('/health/ready/'); assert response.status_code == 200; assert response.json() == {'status': 'ok', 'checks': {'database': 'ok', 'cache': 'ok'}}"

      - name: Verify PostgreSQL and run suite
        run: |
          python manage.py shell -c "from django.db import connection; connection.ensure_connection(); assert connection.vendor == 'postgresql'"
          python manage.py check --database default
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          pytest -q

      - name: PostgreSQL backup and restore recovery drill
        env:
          RECOVERY_TARGET_URL: postgresql://postgres:postgres@127.0.0.1:5432/cultural_currency_restore
        run: |
          rm -rf artifacts/recovery-ci
          mkdir -p artifacts/recovery-ci

          python manage.py seed_reference_data

          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BACKUP_PATH=artifacts/recovery-ci/source.dump \
            -v "$PWD:/workspace" \
            -w /workspace \
            postgres:18.6-alpine \
            sh scripts/postgres_backup.sh

          if docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BACKUP_PATH=artifacts/recovery-ci/source.dump \
            -v "$PWD:/workspace" \
            -w /workspace \
            postgres:18.6-alpine \
            sh scripts/postgres_backup.sh; then
            echo "Expected backup overwrite guard to reject the existing archive." >&2
            exit 1
          fi

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:18.6-alpine \
            createdb --host=127.0.0.1 --username=postgres cultural_currency_restore

          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e RESTORE_DATABASE_URL="$RECOVERY_TARGET_URL" \
            -e BACKUP_PATH=artifacts/recovery-ci/source.dump \
            -e RESTORE_CONFIRM=restore-empty-database \
            -v "$PWD:/workspace" \
            -w /workspace \
            postgres:18.6-alpine \
            sh scripts/postgres_restore.sh

          if docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e RESTORE_DATABASE_URL="$RECOVERY_TARGET_URL" \
            -e BACKUP_PATH=artifacts/recovery-ci/source.dump \
            -e RESTORE_CONFIRM=restore-empty-database \
            -v "$PWD:/workspace" \
            -w /workspace \
            postgres:18.6-alpine \
            sh scripts/postgres_restore.sh; then
            echo "Expected restore guard to reject the non-empty target database." >&2
            exit 1
          fi

          DATABASE_URL="$RECOVERY_TARGET_URL" python manage.py check --database default
          DATABASE_URL="$RECOVERY_TARGET_URL" python manage.py migrate --check
          DATABASE_URL="$RECOVERY_TARGET_URL" python manage.py shell -c "from apps.countries.models import Country, CountryCurrency, Currency; fi = Country.objects.get(iso2='FI'); eur = Currency.objects.get(code='EUR'); assert fi.name == 'Finland'; assert CountryCurrency.objects.filter(country=fi, currency=eur, is_primary=True, valid_to__isnull=True).exists()"

      - name: Production deploy security check
        env:
          APP_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: app.example.test
          DJANGO_SECRET_KEY: ci-production-check-7Qv9pL2mN4xR8sT1uW3yZ6aB5cD0eF7gH9jK2mP4
          DJANGO_HTTPS_MODE: proxy
          DJANGO_HSTS_SECONDS: "300"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
          DJANGO_CSP_MODE: enforce
          MEDIA_STORAGE_BACKEND: s3
          MEDIA_S3_BUCKET: ci-managed-media
          MEDIA_S3_REGION: eu-central-1
          MEDIA_S3_PUBLIC_ORIGIN: https://media.example.test
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py shell -c "from django.conf import settings; from django.test import Client; assert settings.SECURE_SSL_REDIRECT is True; assert settings.SECURE_PROXY_SSL_HEADER == ('HTTP_X_FORWARDED_PROTO', 'https'); assert settings.SECURE_HSTS_SECONDS == 300; assert settings.SESSION_COOKIE_SECURE is True; assert settings.CSRF_COOKIE_SECURE is True; assert settings.CONTENT_SECURITY_POLICY_HEADER == 'Content-Security-Policy'; assert settings.STORAGES['default']['BACKEND'] == 'storages.s3.S3Storage'; assert settings.MEDIA_URL == 'https://media.example.test/media/'; response = Client(HTTP_HOST='app.example.test', HTTP_X_FORWARDED_PROTO='https').get('/health/live/'); assert response.status_code == 200; policy = response['Content-Security-Policy']; assert \"script-src 'self'\" in policy; assert \"script-src-attr 'none'\" in policy; assert \"object-src 'none'\" in policy; assert \"frame-ancestors 'none'\" in policy; assert \"img-src 'self' https://media.example.test\" in policy"

  frontend:
    name: Frontend required
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run quality

  chromium:
    name: Chromium required
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      BROWSER_QUALITY_ENGINE: chromium
      BROWSER_QUALITY_SCOPE: full
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build and validate browser surface
        run: |
          djlint templates --check --no-github-output
          djlint templates --lint --no-github-output
          cd frontend
          npm run quality
          cd ..
          python manage.py check
          python manage.py migrate --noinput
          python manage.py seed_reference_data
          python manage.py seed_story_data
          python manage.py seed_destination_context
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/required-browser-server.log 2>&1 &
          echo $! > /tmp/required-browser-server.pid

          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          urls = (
              "http://127.0.0.1:8000/",
              "http://127.0.0.1:8000/_design/shell/",
              "http://127.0.0.1:8000/_design/converter/",
          )
          deadline = time.time() + 20

          while time.time() < deadline:
              try:
                  if all(urllib.request.urlopen(url, timeout=2).status == 200 for url in urls):
                      break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.5)
          else:
              raise SystemExit("Required browser server did not become ready")
          PY

          cd frontend
          npm run browser:quality

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/required-browser-server.log || true

      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/required-browser-server.pid ]; then
            kill "$(cat /tmp/required-browser-server.pid)" || true
          fi

  required:
    name: Required merge quality
    needs:
      - classify
      - python
      - postgres
      - frontend
      - chromium
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"

          for result in "$PYTHON_RESULT" "$POSTGRES_RESULT" "$FRONTEND_RESULT" "$CHROMIUM_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required lane finished with result: $result"
              exit 1
            fi
          done
