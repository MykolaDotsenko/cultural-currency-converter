name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "apps/common/templatetags/vite.py"
      - "config/settings.py"
      - ".nvmrc"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "apps/common/templatetags/vite.py"
      - "config/settings.py"
      - ".nvmrc"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / TypeScript / Biome / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Biome
        working-directory: frontend
        run: npm run check

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Verify Vite backend manifest
        run: |
          test -s static/build/.vite/manifest.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('static/build/.vite/manifest.json', 'utf8'));
            const entry = manifest['frontend/src/app.ts'];
            if (!entry?.file || entry.isEntry !== true) {
              throw new Error('Expected Vite entry frontend/src/app.ts is missing or invalid');
            }
          "

      - name: Verify production asset public base
        run: |
          node --input-type=module -e "
            import { readdirSync, readFileSync } from 'node:fs';
            const cssFiles = readdirSync('static/build/assets').filter((name) => name.endsWith('.css'));
            const fontUrls = cssFiles.flatMap((name) => {
              const css = readFileSync('static/build/assets/' + name, 'utf8');
              return [...css.matchAll(/url\\(([^)]+\\.(?:woff2?|ttf|otf))\\)/gi)].map((match) =>
                match[1].replace(/^['\"']|['\"']$/g, ''),
              );
            });
            if (fontUrls.length > 0) {
              throw new Error(
                'Production CSS must not trigger runtime webfont requests: ' + fontUrls.join(', '),
              );
            }
          "
